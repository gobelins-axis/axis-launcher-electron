<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Joystick calibration</title>
    <style>
        /* Darker Grotesque, same files as axis-launcher-front/static/fonts, Google weight mapping */
        @font-face { font-family: 'Darker Grotesque'; font-weight: 500; font-style: normal; font-display: swap; src: url('./fonts/DarkerGrotesque-Medium.ttf') format('truetype'); }
        @font-face { font-family: 'Darker Grotesque'; font-weight: 600; font-style: normal; font-display: swap; src: url('./fonts/DarkerGrotesque-SemiBold.ttf') format('truetype'); }
        @font-face { font-family: 'Darker Grotesque'; font-weight: 700; font-style: normal; font-display: swap; src: url('./fonts/DarkerGrotesque-Bold.ttf') format('truetype'); }
        @font-face { font-family: 'Darker Grotesque'; font-weight: 800; font-style: normal; font-display: swap; src: url('./fonts/DarkerGrotesque-ExtraBold.ttf') format('truetype'); }

        :root {
            /* axis-launcher-front + axis-hub palette */
            --black: #000000;
            --black-1: #1F1F1F;
            --black-2: #333333;
            --grey: #6D6E70;
            --light-grey: #ACACAC;
            --white: #ffffff;
            --yellow: #FFD600;
            --red: #FF3E3E;

            /* Motion, same easing family as the front */
            --expo-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        /* 1rem = 1vw, values below are px / 25.6 (2560 reference), like rem(px, 'large') in the front */
        html { font-size: 1vw; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Darker Grotesque', sans-serif;
            font-weight: 600;
            color: var(--white);
            background-color: var(--black);
            cursor: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .layout {
            position: relative;
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100%;
            padding: 3.125rem 3.125rem 6.5rem; /* 80px, room for the inputs row */
        }

        /* Header: logo + section tag */
        .header {
            display: flex;
            align-items: center;
        }

        .logo {
            display: block;
            width: auto;
            height: 5.2rem; /* ~133px on the 2560 reference */
        }

        /* GameTag pill from the front */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 0.117rem 0.469rem 0.195rem; /* 3px 12px 5px 12px */
            font-weight: 700;
            font-size: 0.781rem;   /* 20px */
            line-height: 1.055rem; /* 27px */
            color: var(--black-1);
            background-color: var(--white);
            border-radius: 0.781rem 0.781rem 0.781rem 0; /* 20px, square bottom-left */
            white-space: nowrap;
        }

        .tag--status { min-height: 1.37rem; }
        .tag--status:empty { visibility: hidden; }
        .tag--status.is-missing { background-color: var(--yellow); }
        .tag--status.no-signal { color: var(--white); background-color: var(--red); }

        /* Views */
        .view {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 1.2rem;
            min-height: 0;
        }

        .heading {
            max-width: 46rem;
            margin-top: 1.4rem;
        }

        .title {
            font-weight: 800;
            font-size: 5rem;       /* 128px */
            line-height: 4.492rem; /* 115px */
        }

        .heading--center {
            max-width: none;
            justify-self: center;
            text-align: center;
        }

        .heading--center .description {
            margin-left: auto;
            margin-right: auto;
        }

        /* Call to action: the button glyph sits inline in the sentence */
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;           /* a word space around the glyph */
            margin-top: 1.6rem;
            font-weight: 700;
            font-size: 1.25rem;    /* 32px */
            line-height: 1.68rem;  /* 43px */
        }

        /* Inline in a sentence the glyph matches the cap height rather than the indicator size */
        .cta .input-icon {
            height: 1.15em;        /* ~37px at 32px text */
        }

        .description {
            margin-top: 1.1rem;
            max-width: 34rem;
            font-weight: 700;
            font-size: 1.406rem;   /* 36px */
            line-height: 1.914rem; /* 49px */
            color: var(--light-grey);
        }

        .message {
            margin-top: 0.6rem;
            min-height: 1.9rem;
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.5;
            color: var(--yellow);
        }

        /* Step bars */
        .steps {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.4rem;
            min-height: 0.2rem;
        }

        .steps span {
            width: 2.2rem;
            height: 0.2rem;
            background: var(--black-2);
            transition: background 0.3s var(--expo-out);
        }

        .steps span.is-done { background: var(--grey); }
        .steps span.is-current { background: var(--white); }

        /* Pads */
        .pads {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 7rem;
            min-height: 0;
            padding-top: 1.2rem;
        }

        .joystick {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .joystick-name {
            font-weight: 800;
            font-size: 1.75rem;
            line-height: 1;
        }

        .pad {
            position: relative;
            /* Sized by width like the front, capped by height so short windows never overlap the heading */
            width: min(15rem, 30vh);
            height: min(15rem, 30vh);
            background: var(--black-1);
            border-radius: 50%;
        }

        .pad::before,
        .pad::after {
            content: "";
            position: absolute;
            background: var(--black-2);
        }

        .pad::before { left: 50%; top: 0; width: 1px; height: 100%; }
        .pad::after { top: 50%; left: 0; height: 1px; width: 100%; }

        /* Deadzone ring (axis-api default 0.2) */
        .pad-deadzone {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20%;
            height: 20%;
            margin: -10% 0 0 -10%;
            border: 1px dashed var(--grey);
            border-radius: 50%;
            opacity: 0.6;
        }

        .dot {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 1;
            border-radius: 50%;
            transform: translate(0, 0);
        }

        .dot.is-hidden { opacity: 0; }

        /* What games see */
        .dot--game {
            width: 1.5rem;
            height: 1.5rem;
            margin: -0.75rem 0 0 -0.75rem;
            background: var(--white);
        }

        /* Raw board value */
        .dot--raw {
            width: 1.1rem;
            height: 1.1rem;
            margin: -0.55rem 0 0 -0.55rem;
            background: var(--light-grey);
            opacity: 0.35;
        }

        /* Calibration-view white dot (relative raw during the guided steps) */
        .dot--live {
            width: 1.5rem;
            height: 1.5rem;
            margin: -0.75rem 0 0 -0.75rem;
            background: var(--white);
        }

        .dot--live.is-preview { background: var(--white); }

        /* Numbers */
        .values {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.3;
            color: var(--light-grey);
            font-variant-numeric: tabular-nums;
        }

        .value {
            display: grid;
            grid-template-columns: 2.6rem 3.2rem 3.2rem;
            text-align: right;
        }

        .value-label {
            text-align: left;
            color: var(--grey);
        }

        .status {
            font-weight: 600;
            font-size: 1rem;
            color: var(--grey);
            min-height: 1.3rem;
        }

        /* Inputs, same placement and rhythm as the front's Inputs component */
        .inputs {
            position: absolute;
            right: 3.125rem;   /* 80px */
            bottom: 3.125rem;
            display: flex;
            align-items: center;
        }

        /* Fade out 0.1s / in 0.5s when the set of inputs changes, as in the front */
        .inputs-container {
            display: flex;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.37, 0, 0.63, 1);
        }

        .inputs-container.is-switching {
            opacity: 0;
            transition-duration: 0.1s;
        }

        .input-indicator {
            display: flex;
            align-items: center;
            margin-left: 1.172rem; /* 30px */
        }

        .input-icon {
            /* The front never sizes the glyph in CSS: it renders at its intrinsic 42px */
            display: block;
            width: auto;
            height: 42px;
            flex: none;
        }

        .input-indicator .label {
            margin-left: 0.781rem; /* 20px */
            font-weight: 700;
            font-size: 1.25rem;    /* 32px */
            line-height: 1.68rem;  /* 43px */
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="layout">
        <header class="header">
            <img class="logo" src="./icons/logo.svg" alt="Axis">
        </header>

        <!-- Overview: live positions of both joysticks as games see them -->
        <main class="view js-view-overview">
            <div class="heading heading--center">
                <h1 class="title">Joystick check</h1>
                <p class="description">Move both joysticks. The white dot is what games see, the grey one is the raw board value. If both feel right, exit with Home.</p>
                <p class="cta">Press <img class="input-icon" src="./icons/input-a.svg" alt="A"> to start calibration</p>
            </div>

            <div class="pads">
                <section class="overview-joystick joystick" data-joystick="1">
                    <h2 class="joystick-name">Joystick 1</h2>
                    <div class="pad">
                        <div class="pad-deadzone"></div>
                        <div class="dot dot--raw js-overview-dot-raw"></div>
                        <div class="dot dot--game js-overview-dot"></div>
                    </div>
                    <div class="values">
                        <div class="value"><span class="value-label">Game</span><span class="value-number js-overview-game-x">0.00</span><span class="value-number js-overview-game-y">0.00</span></div>
                        <div class="value"><span class="value-label">Raw</span><span class="value-number js-overview-raw-x">–</span><span class="value-number js-overview-raw-y">–</span></div>
                    </div>
                    <div class="tag tag--status js-overview-calibrated"></div>
                </section>

                <section class="overview-joystick joystick" data-joystick="2">
                    <h2 class="joystick-name">Joystick 2</h2>
                    <div class="pad">
                        <div class="pad-deadzone"></div>
                        <div class="dot dot--raw js-overview-dot-raw"></div>
                        <div class="dot dot--game js-overview-dot"></div>
                    </div>
                    <div class="values">
                        <div class="value"><span class="value-label">Game</span><span class="value-number js-overview-game-x">0.00</span><span class="value-number js-overview-game-y">0.00</span></div>
                        <div class="value"><span class="value-label">Raw</span><span class="value-number js-overview-raw-x">–</span><span class="value-number js-overview-raw-y">–</span></div>
                    </div>
                    <div class="tag tag--status js-overview-calibrated"></div>
                </section>
            </div>
        </main>

        <!-- Calibration flow: one joystick at a time -->
        <main class="view js-view-calibration" hidden>
            <div class="heading">
                <div class="steps js-steps"></div>
                <h1 class="title js-instruction"></h1>
                <p class="description js-hint"></p>
                <p class="message js-message"></p>
            </div>

            <div class="pads">
                <section class="joystick">
                    <div class="pad">
                        <div class="pad-deadzone"></div>
                        <div class="dot dot--raw js-dot-raw"></div>
                        <div class="dot dot--live js-dot"></div>
                    </div>
                    <div class="values">
                        <div class="value"><span class="value-label">Raw</span><span class="value-number js-raw-x">–</span><span class="value-number js-raw-y">–</span></div>
                        <div class="value js-preview-row" hidden><span class="value-label">Game</span><span class="value-number js-preview-x">0.00</span><span class="value-number js-preview-y">0.00</span></div>
                    </div>
                    <div class="status js-status"></div>
                    <span class="js-preview" hidden></span>
                </section>
            </div>
        </main>

        <footer class="inputs">
            <div class="inputs-container js-inputs"></div>
        </footer>
    </div>


    <!--
        Runs inside the launcher window (nodeIntegration on), so axis-api is
        loaded with require like the main process does, and the preload finds
        window.__axis__ just as it would on a game page.
    -->
    <script src="./calibration.js"></script>
</body>
</html>
