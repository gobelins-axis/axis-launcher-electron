<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alternative controllers debug</title>
    <style>
        /* Same system as src/calibration: Darker Grotesque, 1rem = 1vw against a 2560 reference */
        @font-face { font-family: 'Darker Grotesque'; font-weight: 500; font-style: normal; font-display: swap; src: url('../calibration/fonts/DarkerGrotesque-Medium.ttf') format('truetype'); }
        @font-face { font-family: 'Darker Grotesque'; font-weight: 600; font-style: normal; font-display: swap; src: url('../calibration/fonts/DarkerGrotesque-SemiBold.ttf') format('truetype'); }
        @font-face { font-family: 'Darker Grotesque'; font-weight: 700; font-style: normal; font-display: swap; src: url('../calibration/fonts/DarkerGrotesque-Bold.ttf') format('truetype'); }
        @font-face { font-family: 'Darker Grotesque'; font-weight: 800; font-style: normal; font-display: swap; src: url('../calibration/fonts/DarkerGrotesque-ExtraBold.ttf') format('truetype'); }

        :root {
            --black: #000000;
            --black-1: #1F1F1F;
            --black-2: #333333;
            --grey: #6D6E70;
            --light-grey: #ACACAC;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        html { font-size: 1vw; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            font-family: 'Darker Grotesque', sans-serif;
            font-weight: 600;
            color: var(--white);
            background-color: var(--black);
            cursor: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .layout {
            position: relative;
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100%;
            padding: 3.125rem 3.125rem 6.5rem;
        }

        .logo { display: block; width: auto; height: 5.2rem; }

        .view {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 1.6rem;
            min-height: 0;
        }

        .heading { max-width: 46rem; margin-top: 1.4rem; }

        .title {
            font-weight: 800;
            font-size: 5rem;
            line-height: 4.492rem;
        }

        .description {
            margin-top: 1.1rem;
            max-width: 40rem;
            font-weight: 700;
            font-size: 1.406rem;
            line-height: 1.914rem;
            color: var(--light-grey);
        }

        /* Panels */
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            min-height: 0;
        }

        .panel { display: grid; grid-template-rows: auto 1fr; min-height: 0; }

        .panel-title {
            font-weight: 800;
            font-size: 1.75rem;
            line-height: 1;
            margin-bottom: 1.2rem;
        }

        .panel-note {
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.4;
            color: var(--grey);
        }

        /* Devices */
        .devices { overflow: hidden; }

        .device {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.9rem 1.2rem;
            align-items: start;
            padding: 1.2rem 0;
            border-top: 1px solid var(--black-1);
        }

        .device-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 50%;
            background: var(--black-1);
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--light-grey);
        }

        .device.is-connected .device-slot { background: var(--white); color: var(--black); }

        .device-name {
            font-weight: 800;
            font-size: 1.75rem;
            line-height: 1;
        }

        .device-state {
            display: inline-block;
            margin-left: 0.8rem;
            padding: 0.12rem 0.5rem 0.2rem;
            border-radius: 0.8rem 0.8rem 0.8rem 0;
            background: var(--black-1);
            font-weight: 700;
            font-size: 0.8rem;
            line-height: 1;
            color: var(--light-grey);
            vertical-align: middle;
        }

        .device.is-connected .device-state { background: var(--white); color: var(--black); }

        .device-meta {
            margin-top: 0.4rem;
            font-weight: 600;
            font-size: 1rem;
            color: var(--grey);
            font-variant-numeric: tabular-nums;
        }

        .device-last {
            margin-top: 0.6rem;
            display: grid;
            grid-template-columns: auto auto;
            justify-content: start;
            column-gap: 1.2rem;
            row-gap: 0.15rem;
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.3;
            color: var(--light-grey);
            font-variant-numeric: tabular-nums;
        }

        .device-last dt { color: var(--grey); }

        /* Raw log */
        .log {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--light-grey);
            font-variant-numeric: tabular-nums;
        }

        /* flex: none, otherwise lines that do not fit get shrunk to slivers
           instead of being clipped at the top by the panel. */
        .log-line { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-line .path { color: var(--grey); margin-right: 0.8rem; }

        /* Inputs, front pattern */
        .inputs {
            position: absolute;
            right: 3.125rem;
            bottom: 3.125rem;
            display: flex;
            align-items: center;
        }

        .input-indicator { display: flex; align-items: center; margin-left: 1.172rem; }
        .input-icon { display: block; width: auto; height: 42px; flex: none; }

        .input-indicator .label {
            margin-left: 0.781rem;
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.68rem;
            white-space: nowrap;
        }

        .footnote {
            position: absolute;
            left: 3.125rem;
            bottom: 3.125rem;
            font-weight: 600;
            font-size: 1rem;
            color: var(--grey);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="layout">
        <header>
            <img class="logo" src="../calibration/icons/logo.svg" alt="Axis">
        </header>

        <main class="view">
            <div class="heading">
                <h1 class="title">Alternative controllers</h1>
                <p class="description">Plug any USB serial board. It is pinged and has three seconds to answer with a ready line; accepted boards get a slot and their messages show up here as a game would receive them.</p>
            </div>

            <div class="panels">
                <section class="panel">
                    <h2 class="panel-title">Devices</h2>
                    <div class="devices js-devices">
                        <p class="panel-note js-empty">Nothing plugged in yet.</p>
                    </div>
                </section>

                <section class="panel">
                    <h2 class="panel-title">Raw lines</h2>
                    <div class="log js-log"></div>
                </section>
            </div>
        </main>

        <div class="footnote">Messages received: <span class="js-count">0</span></div>

        <footer class="inputs">
            <div class="input-indicator"><img class="input-icon" src="../calibration/icons/input-home.svg" alt=""><span class="label">Exit</span></div>
        </footer>
    </div>

    <script src="./alternative-debug.js"></script>
</body>
</html>
